                    Object.defineProperty(window, "__legacyTableTransientSSOCode", {
                        configurable: true,
                        enumerable: false,
                        value: legacyTableSsoCode,
                        writable: false
                    });

                    Object.defineProperty(window, "__legacyTableTransientTransferCredential", {
                        configurable: true,
                        enumerable: false,
                        value: legacyTableTransferCredential,
                        writable: false
                    });
                }
                window.history.replaceState(null, "", "/sso");
